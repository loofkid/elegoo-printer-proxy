name: Sync upstream and build image

on:
  schedule:
    # Check every 6 hours
    - cron: "17 */6 * * *"

  workflow_dispatch:

  # Still build when you manually push changes to your fork
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-and-build-main
  cancel-in-progress: false

jobs:
  sync:
    # Avoid syncing again when this workflow was started by your own push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream \
            https://github.com/lantern-eight/elegoo-printer-proxy.git

          git fetch upstream main

          before="$(git rev-parse HEAD)"

          # Retain your workflow and other fork-specific commits while
          # merging new commits from the upstream repository.
          git merge upstream/main --no-edit

          after="$(git rev-parse HEAD)"

          if [[ "$before" == "$after" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git push origin main
          fi

  build-after-sync:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out updated fork
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-after-user-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
